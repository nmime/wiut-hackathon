name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wiut
          POSTGRES_PASSWORD: wiut_dev
          POSTGRES_DB: wiut_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wiut -d wiut_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: python3 -m unittest discover -s tests/operations -v
      - run: bash -n scripts/deploy.sh scripts/install-operations.sh
      - run: pnpm exec playwright install --with-deps chromium
      - run: psql -h 127.0.0.1 -p 55432 -U wiut -d postgres -c 'CREATE DATABASE wiut_no_ml'
        env:
          PGPASSWORD: wiut_dev
      - run: pnpm test:e2e
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.28'
          python-version: '3.12'
      - run: uv sync --frozen
        working-directory: ml-service
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: ml-service
      - run: uv run python -m capacity_ml.train
        working-directory: ml-service
      - run: uv run pytest
        working-directory: ml-service
      - run: uv run python -m capacity_ml.evaluate
        working-directory: ml-service
      - run: uv run python -m capacity_ml.evaluate_public
        working-directory: ml-service
      - run: uv run python -m capacity_ml.evaluate_revenue
        working-directory: ml-service
      - run: uv run python -m capacity_ml.evaluate_international
        working-directory: ml-service
      - run: uv run python -m capacity_ml.evaluate_external
        working-directory: ml-service
      - run: uv run python -m capacity_ml.evaluate_engineering
        working-directory: ml-service
      - run: psql -h 127.0.0.1 -p 55432 -U wiut -d postgres -c 'CREATE DATABASE wiut_real_ml'
        env:
          PGPASSWORD: wiut_dev
      - run: pnpm test:real-ml
      - run: uv sync --frozen
        working-directory: teammate-ml-service
      - run: uv run ruff check teammate_bridge tests && uv run ruff format --check teammate_bridge tests
        working-directory: teammate-ml-service
      - run: uv run pytest -q
        working-directory: teammate-ml-service
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - run: psql -h 127.0.0.1 -p 55432 -U wiut -d postgres -c 'CREATE DATABASE wiut_teammate_ml'
        env:
          PGPASSWORD: wiut_dev
      - run: pnpm test:teammate-ml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
