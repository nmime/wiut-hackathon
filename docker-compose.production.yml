name: flowcredit
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wiut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/deploy.sh to generate production credentials}
      POSTGRES_DB: wiut
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wiut -d wiut']
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped
  ml:
    build:
      context: .
      dockerfile: hybrid-runtime/Dockerfile
    environment:
      FINAL_MODEL_BUNDLE: /app/ml-service/final_model/artifacts
      ML_AUDIT_PATH: /data/audit/requests.jsonl
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    volumes:
      - ml-audit:/data/audit
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      DATABASE_URL: postgres://wiut:${POSTGRES_PASSWORD:?Production password is required}@db:5432/wiut
      ML_SERVICE_URL: http://ml:8000
      ML_TIMEOUT_MS: ${ML_TIMEOUT_MS:-8000}
      CORS_ORIGINS: https://${DOMAIN:?Production domain is required}
      SESSION_COOKIE_SECURE: 'true'
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Run scripts/deploy.sh to initialize the private auth encryption key}
      # API is unpublished; only the internal nginx supplies the client header.
      TRUST_PROXY_HOPS: '1'
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports:
      - '127.0.0.1:18080:80'
    environment:
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-172.30.84.1}
      # Preserve nginx's own variables such as $remote_addr and $http_host.
      NGINX_ENVSUBST_FILTER: '^TRUSTED_PROXY_IP$'
    volumes:
      - ./docker/nginx.production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./artifacts/deployment:/data/release:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres-data:
  ml-audit:
  teammate-ml-audit:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.84.0/24
          gateway: 172.30.84.1
