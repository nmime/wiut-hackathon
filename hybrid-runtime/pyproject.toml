[project]
name = "flowcredit-final-runtime"
version = "1.0.0"
description = "One local scorer with real-revenue forecasts and audited seasonal credit policy"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.0",
  "uvicorn==0.54.0",
  "scikit-learn==1.9.1",
  "numpy==2.5.3",
  "joblib==1.6.0",
  "pandas==3.0.6",
  "scipy==1.17.1",
  "lightgbm==4.7.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../ml-service", "../teammate-ml-service"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
