name: wiut-hackathon
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wiut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wiut_dev}
      POSTGRES_DB: wiut
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wiut -d wiut']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgres://wiut:${POSTGRES_PASSWORD:-wiut_dev}@db:5432/wiut
      ML_SERVICE_URL: ${ML_SERVICE_URL:-}
      ML_TIMEOUT_MS: ${ML_TIMEOUT_MS:-8000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
