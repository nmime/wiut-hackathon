[project]
name = "wiut-capacity-ml"
version = "0.1.0"
description = "Local synthetic cash-flow forecasting and explainable payment capacity"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.0",
  "uvicorn==0.54.0",
  "scikit-learn==1.9.1",
  "numpy==2.5.3",
  "joblib==1.6.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Long rationale/advisory strings and generated Markdown prose.

[tool.uv]
package = false
